<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lumina hand motion study</title>
    <style>
      body {
        margin: 0;
        overflow-x: hidden;
        background: #101115;
        color: #eee;
        font: 15px system-ui;
      }
      header {
        padding: 20px 28px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      h1 {
        font-size: 22px;
        margin: 0;
      }
      p {
        color: #aab0bc;
        margin: 6px 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 60vh;
      }
      footer {
        padding: 16px 28px;
        display: flex;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
      }
      button,
      select {
        background: #252830;
        color: #fff;
        border: 1px solid #565c69;
        border-radius: 8px;
        padding: 10px;
      }
      input[type="range"] {
        width: 250px;
      }
      output {
        font-variant-numeric: tabular-nums;
        color: #b8c3d6;
      }
      .note {
        padding: 0 28px 16px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Hand motion study</h1>
        <p>Imported hand model · constrained joints · silent prototype</p>
      </div>
      <span id="status">Loading hand…</span>
    </header>
    <main id="viewport"></main>
    <footer>
      <button id="play">Play</button
      ><select id="exercise" aria-label="Exercise">
        <option value="scale">C major scale</option>
        <option value="chords">Chord changes</option>
        <option value="crossing">Thumb crossing</option></select
      ><label
        >Time
        <input
          id="time"
          aria-label="Time"
          type="range"
          min="0"
          max="10"
          step="0.01"
          value="0" /></label
      ><label
        >Speed
        <select id="speed">
          <option value="0.5">½ speed</option>
          <option value="1" selected>Normal</option>
        </select></label
      ><button id="view">Top view</button
      ><label><input type="checkbox" id="targets" />Contact targets</label
      ><output id="error"></output
      ><button id="audit">Check all exercises</button>
    </footer>
    <p class="note" id="audit-result" role="status"></p>
    <p class="note">
      Evaluation only. Motion is authored and solved from key targets, not
      captured from a pianist. Showcase and the app renderer are unchanged.
    </p>
    <script type="module" src="./study.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lumina hand motion study</title>
    <style>
      body {
        margin: 0;
        overflow-x: hidden;
        background: #101115;
        color: #eee;
        font: 15px system-ui;
      }
      header {
        padding: 20px 28px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      h1 {
        font-size: 22px;
        margin: 0;
      }
      p {
        color: #aab0bc;
        margin: 6px 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 60vh;
      }
      footer {
        padding: 16px 28px;
        display: flex;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
      }
      button,
      select {
        background: #252830;
        color: #fff;
        border: 1px solid #565c69;
        border-radius: 8px;
        padding: 10px;
      }
      input[type="range"] {
        width: 250px;
      }
      output {
        font-variant-numeric: tabular-nums;
        color: #b8c3d6;
      }
      .note {
        padding: 0 28px 16px;
        font-size: 13px;
      }

      body { background: #0b0b0d; font: 14px system-ui; }
      header { display: none; }
      canvas { height: auto; }
      #viewport { overflow: hidden; border-block: 1px solid #ffffff12; }
      section.note { padding: 16px 20px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
      footer { padding: 16px 20px; gap: 14px; }
      footer details, #view { display: none; }
      #import-status:empty, #audit-result:empty { display: none; }
      #exercise { max-width: 210px; }
      button, select { background: #17171b; border-color: #ffffff25; border-radius: 20px; }
      #play { min-width: 76px; background: #f5f5f7; color: #0b0b0d; }
      input[type="file"] { max-width: 220px; }
      #time { accent-color: #a8cee8; }

      summary { cursor: pointer; padding: 10px 0; color: #aab0bc; }
      details[open] { padding-bottom: 12px; }
      input, select { max-width: 100%; box-sizing: border-box; }
      input[type="range"] { width: min(250px, 55vw); }
      :focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
      @media(max-width: 600px) {
        header, footer { padding: 16px; }
        .note { padding-left: 16px; padding-right: 16px; }
        section.note { display: grid; gap: 12px; }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Generated hands</h1>
        <p></p>
      </div>
      <span id="status">Loading hand…</span>
    </header>
    <section class="note" aria-label="MIDI import">
      <label
        >Open MIDI
        <input
          id="midi-file"
          type="file"
          accept=".mid,.midi,audio/midi,audio/x-midi"
      /></label>
      <button id="full-demo">Load sample</button>
      <details><summary>MIDI options</summary><label
        >Hands
        <select id="hand-mode">
          <option value="auto">Automatic</option>
          <option value="split">Split by pitch</option>
        </select></label
      >
      <label
        >Split note
        <input
          id="split-pitch"
          type="number"
          min="21"
          max="108"
          value="60"
          aria-label="Split MIDI note"
      /></label>
      </details><button id="cancel-import" hidden>Cancel import</button>
      <p id="import-status" role="status">

      </p>
    </section>
    <main id="viewport"></main>
    <footer>
      <button id="play">Play</button
      ><select id="exercise" aria-label="Exercise">
        <option value="scale">C major scale</option>
        <option value="performance" selected>
          Lumina miniature · both hands
        </option>
        <option value="blackkeys">Lumina miniature · transposed +2</option>
        <option value="chords">Chord changes</option>
        <option value="crossing">Thumb crossing</option></select
      ><label
        >Time
        <input
          id="time"
          aria-label="Time"
          type="range"
          min="0"
          max="10"
          step="0.01"
          value="0" /></label
      ><label
        >Speed
        <select id="speed">
          <option value="0.5">½ speed</option>
          <option value="1" selected>Normal</option>
        </select></label
      ><button id="view">Top view</button
      ><output id="clock" aria-label="Playback position"></output><details><summary>Motion diagnostics</summary><label><input type="checkbox" id="targets" />Contact targets</label
      ><output id="error"></output
      ><button id="audit">Check built-in exercises</button></details>
    </footer>
    <p class="note" id="audit-result" role="status"></p>

    <script type="module" src="./study.js"></script>
  </body>
</html>
